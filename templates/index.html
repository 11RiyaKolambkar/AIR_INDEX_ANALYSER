<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQI Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Air Quality Index Analyzer</h1>
        <p class="subtitle">Enter pollution values to predict AQI</p>

        <form method="POST">
            <div class="form-group">
                <label>PM2.5</label>
                <input type="number" name="pm25" placeholder="Enter PM2.5 value" step="0.01" required>
            </div>
            <div class="form-group">
                <label>PM10</label>
                <input type="number" name="pm10" placeholder="Enter PM10 value" step="0.01" required>
            </div>
            <div class="form-group">
                <label>NO2</label>
                <input type="number" name="no2" placeholder="Enter NO2 value" step="0.01" required>
            </div>
            <div class="form-group">
                <label>CO</label>
                <input type="number" name="co" placeholder="Enter CO value" step="0.01" required>
            </div>
            <div class="form-group">
                <label>SO2</label>
                <input type="number" name="so2" placeholder="Enter SO2 value" step="0.01" required>
            </div>
            <button type="submit">Predict AQI</button>
        </form>

        {% if prediction %}
        <div class="result {{ category_class }}">
            <h2>Predicted AQI: <span class="text-{{ category_class }}">{{ prediction }}</span></h2>
            <h3>Category: <span class="text-{{ category_class }}">{{ category }}</span></h3>
            <div class="aqi-guide">
                <p>AQI 0-50 → <span style="color:#2ecc71">Good</span></p>
                <p>AQI 51-100 → <span style="color:#f39c12">Moderate</span></p>
                <p>AQI 101-150 → <span style="color:#e67e22">Unhealthy for Sensitive</span></p>
                <p>AQI 151-200 → <span style="color:#e74c3c">Unhealthy</span></p>
                <p>AQI 200+ → <span style="color:#8e44ad">Hazardous</span></p>
            </div>
        </div>
        {% endif %}
    </div>

</body>
</html>
