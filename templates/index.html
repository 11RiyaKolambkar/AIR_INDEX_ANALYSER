<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQI Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Air Quality Index Analyzer</h1>
        <p class="subtitle">Enter pollution values to predict AQI</p>

        <!-- Auto detect button -->
        <button type="button" onclick="autoFill()">Detect My Location</button>
        <p id="city-name" style="margin-top: 8px; font-weight: bold;"></p>

        <form method="POST">
            <div class="form-group">
                <label>PM2.5</label>
                <input type="number" id="pm25" name="pm25" placeholder="Enter PM2.5 value" step="0.01" required>
            </div>
            <div class="form-group">
                <label>PM10</label>
                <input type="number" id="pm10" name="pm10" placeholder="Enter PM10 value" step="0.01" required>
            </div>
            <div class="form-group">
                <label>NO2</label>
                <input type="number" id="no2" name="no2" placeholder="Enter NO2 value" step="0.01" required>
            </div>
            <div class="form-group">
                <label>CO</label>
                <input type="number" id="co" name="co" placeholder="Enter CO value" step="0.01" required>
            </div>
            <div class="form-group">
                <label>SO2</label>
                <input type="number" id="so2" name="so2" placeholder="Enter SO2 value" step="0.01" required>
            </div>
            <button type="submit">Predict AQI</button>
        </form>

        {% if prediction %}
        <div class="result {{ category_class }}">
            <h2>Predicted AQI: <span style="color: {{ color }}">{{ prediction }}</span></h2>
            <h3>Category: <span style="color: {{ color }}">{{ category }}</span></h3>
            <div class="aqi-guide">
                <p>AQI 0-50 → <span style="color:#2ecc71">Good</span></p>
                <p>AQI 51-100 → <span style="color:#f39c12">Moderate</span></p>
                <p>AQI 101-150 → <span style="color:#e67e22">Unhealthy for Sensitive</span></p>
                <p>AQI 151-200 → <span style="color:#e74c3c">Unhealthy</span></p>
                <p>AQI 200+ → <span style="color:#8e44ad">Hazardous</span></p>
            </div>
        </div>
        {% endif %}
    </div>
<script>
function autoFill() {
    document.getElementById('city-name').innerText = "Detecting location...";

    navigator.geolocation.getCurrentPosition(
        function(position) {
            var lat = position.coords.latitude;
            var lon = position.coords.longitude;
            document.getElementById('city-name').innerText = "Got GPS: " + lat + ", " + lon;

            fetch('/realtime?lat=' + lat + '&lon=' + lon)
            .then(response => response.json())
            .then(result => {
                if (result.status === "ok") {
                    document.getElementById('pm25').value = result.data.pm25;
                    document.getElementById('pm10').value = result.data.pm10;
                    document.getElementById('no2').value  = result.data.no2;
                    document.getElementById('co').value   = result.data.co;
                    document.getElementById('so2').value  = result.data.so2;
                    document.getElementById('city-name').innerText = "Location: " + result.data.city;
                } else {
                    document.getElementById('city-name').innerText = "Error: " + result.message;
                }
            });
        },
        function(error) {
            document.getElementById('city-name').innerText = "GPS failed, code: " + error.code;
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}
</script>


</body>
</html>
